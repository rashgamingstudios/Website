name: Deploy site to GitHub Pages

# The site is a Vite build now, so Pages can't serve the repo as-is — it has to
# be built first and the dist/ output published. For this to run, the repo's
# Settings → Pages → Source must be set to "GitHub Actions", not "Deploy from
# a branch".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the repo that actually owns the Pages site can deploy. On a fork,
    # actions/configure-pages has no Pages site to find and fails, so every
    # push to a fork would report a red X that means nothing. Skipping keeps
    # a failure here meaningful. `deploy` needs `build`, so it skips too.
    if: github.repository == 'rashgamingstudios/Website'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: the runner forces 24 anyway and warns that 20 is deprecated.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
