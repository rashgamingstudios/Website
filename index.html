<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rash Game Studios builds web games, CrazyGames releases with full SDK and launch-approval support, Roblox experiences and one-week prototypes — and makes Cartbo, a social platform for indie game developers."
    />
    <title>Rash Game Studios — Web games, CrazyGames, Roblox &amp; prototypes</title>
    <script>
      // Set theme before first paint so there's no flash. Saved choice wins, then OS preference.
      // Same key and attribute as the arcade site, so the toggle behaves identically on both.
      ;(function () {
        try {
          var t = localStorage.getItem('rash-theme')
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
